# Hugo configuration file
title: log.simples

# Multilingual: Portuguese (Brazil) is the default language, served at the
# site root. English is served under /en/.
defaultContentLanguage: pt-br
defaultContentLanguageInSubdir: false

languages:
  pt-br:
    label: PT
    locale: pt-BR
    weight: 1
  en:
    label: EN
    locale: en-US
    weight: 2

# Taxonomies: Hugo defaults (tags, categories) plus "series", which Hextra's
# opengraph partial reads when a page declares `series` in its front matter.
taxonomies:
  tag: tags
  category: categories
  series: series

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

# Menu labels are translated through i18n/<lang>.yaml using the identifier.
menu:
  main:
    - identifier: blog
      name: Blog
      pageRef: /
      weight: 1
    - identifier: about
      name: Sobre
      pageRef: /about
      weight: 2
    - identifier: archive
      name: Arquivo
      pageRef: /archive
      weight: 3
    - identifier: off-topic
      name: Off-Topic
      pageRef: /off-topic
      weight: 4
    - identifier: search
      name: Search
      weight: 5
      params:
        type: search
    - identifier: language
      name: Idioma
      weight: 6
      params:
        type: language-switch
        label: true
    - identifier: theme
      name: Tema
      weight: 7
      params:
        type: theme-toggle
    - identifier: github
      name: GitHub
      weight: 8
      url: "https://github.com/marciuuu"
      params:
        icon: github

params:
  # Used by Hextra for og:site_name
  title: log.simples

  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: false
    displayPoweredBy: true

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc

  archives:
    section: blog

  editURL:
    enable: true
    base: "https://github.com/marciuuu/marciuuu.github.io/edit/main/content"
